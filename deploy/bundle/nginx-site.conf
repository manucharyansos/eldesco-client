# /etc/nginx/sites-available/eldesco.am  ->  ln -s to sites-enabled, nginx -t, systemctl reload nginx
# Then HTTPS:  certbot --nginx -d eldesco.am -d www.eldesco.am
upstream eldesco_web {
    server localhost:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.eldesco.am;
    return 301 https://eldesco.am$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name eldesco.am;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 1M;

    location / {
        proxy_pass http://eldesco_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
