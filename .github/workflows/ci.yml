name: Frontend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build production cPanel bundle
        run: npm run pack
        env:
          NEXT_PUBLIC_API_URL: https://api.eldesco.am/api
          NEXT_PUBLIC_SITE_URL: https://eldesco.am
      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: eldesco-cpanel
          path: dist/eldesco-cpanel.zip
          if-no-files-found: error
          retention-days: 7
