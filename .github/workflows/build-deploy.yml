name: Next.js Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: 18
  NEXT_PUBLIC_API_URL: https://api.eldesco.am/api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint
      continue-on-error: true

    - name: Type check
      run: npm run type-check
      continue-on-error: true

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: next-build
        path: .next/
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: next-build
        path: .next/

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install production dependencies
      run: npm ci --omit=dev

    - name: Deploy to Production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        
        # Copy files to server
        scp -i ~/.ssh/deploy_key -r .next/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
        scp -i ~/.ssh/deploy_key -r node_modules/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
        scp -i ~/.ssh/deploy_key package.json package-lock.json $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
        
        # Restart PM2
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
        cd $DEPLOY_PATH
        pm2 restart eldesco-client
        pm2 save
        EOF
        
        rm ~/.ssh/deploy_key

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'ELDESCO Client Deployment'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
